name: Build Arvan Xray Portal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Arvan Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ARVAN_REGISTRY }}
          username: ${{ secrets.ARVAN_REGISTRY_USERNAME }}
          password: ${{ secrets.ARVAN_REGISTRY_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            -t ${{ secrets.ARVAN_REGISTRY }}/arvan-xray-portal:0.1 \
            ./arvan-xray-portal

      - name: Push image to Arvan Registry
        run: |
          docker push ${{ secrets.ARVAN_REGISTRY }}/arvan-xray-portal:0.1

      - name: Verify pull from Arvan Registry
        run: |
          docker image rm ${{ secrets.ARVAN_REGISTRY }}/arvan-xray-portal:0.1 || true
          docker pull ${{ secrets.ARVAN_REGISTRY }}/arvan-xray-portal:0.1
          docker run --rm \
            --entrypoint /usr/local/bin/xray \
            ${{ secrets.ARVAN_REGISTRY }}/arvan-xray-portal:0.1 \
            run -test -config /usr/local/etc/xray/config.json
