name: Build Arvan Xray Portal

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build classic Docker image
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            -t dsebg/arvan-xray-portal:0.4 \
            ./arvan-xray-portal

      - name: Push to Docker Hub
        run: |
          docker push dsebg/arvan-xray-portal:0.4

      - name: Verify logged-in pull
        run: |
          docker image rm dsebg/arvan-xray-portal:0.4 || true
          docker pull dsebg/arvan-xray-portal:0.4
          docker run --rm --entrypoint /usr/local/bin/xray dsebg/arvan-xray-portal:0.4 run -test -config /usr/local/etc/xray/config.json

      - name: Verify anonymous public pull
        run: |
          docker logout
          docker image rm dsebg/arvan-xray-portal:0.4 || true
          docker pull dsebg/arvan-xray-portal:0.4
          docker run --rm --entrypoint /usr/local/bin/xray dsebg/arvan-xray-portal:0.4 run -test -config /usr/local/etc/xray/config.json
