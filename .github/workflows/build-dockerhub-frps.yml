name: Build FRPS DockerHub

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: "0.2"
  DOCKERHUB_IMAGE: dsebg/arvan-frps

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate files
        run: |
          test -f arvan-frps/Dockerfile || (echo "Missing arvan-frps/Dockerfile" && exit 1)
          test -f arvan-frps/frps.toml || (echo "Missing arvan-frps/frps.toml" && exit 1)
          echo "Files OK"
          echo "---- frps.toml ----"
          sed -n '1,120p' arvan-frps/frps.toml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./arvan-frps
          file: ./arvan-frps/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_IMAGE }}:latest

      - name: Verify anonymous Docker Hub pull
        run: |
          docker logout
          docker pull ${DOCKERHUB_IMAGE}:${IMAGE_TAG}
          docker image inspect ${DOCKERHUB_IMAGE}:${IMAGE_TAG}

      - name: Print deploy image
        run: |
          echo "Use this image in Arvan:"
          echo "${DOCKERHUB_IMAGE}:${IMAGE_TAG}"
